services:
  postgres:
    image: postgres:16-alpine
    container_name: adserving-postgres
    environment:
      POSTGRES_USER: adserving
      POSTGRES_PASSWORD: adserving
      POSTGRES_DB: adserving
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adserving"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adserving-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
